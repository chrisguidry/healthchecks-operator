# The coverage gate, which `make test-go` and CI run.
#
# The floor only rises. Set it just under what the tests measure, so a
# change that loses coverage fails, and raise it when a change gains
# coverage.
#
# The gate measures on a pinned toolchain. The Makefile says why.

profile: coverage.out

threshold:
  # go test never calls main(), and the part of run() after the
  # in-cluster config runs only in a pod, so those statements never
  # count as covered.
  total: 91

exclude:
  paths:
    # The fake Healthchecks server is a test fixture that the tests of
    # other packages import. Its coverage is not the operator's.
    - ^healthchecks/healthcheckstest/
