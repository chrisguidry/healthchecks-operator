# Every image this repository publishes goes through this workflow.
#
# A pushed tag is a release. The tag is a calendar version,
# 2026.09.27-001, and the image ships under that tag and :latest. A push
# to main is a development build. Its version is the most recent release
# tag with a suffix, 2026.09.27-001-dev-003-abcdef01, where 003 counts
# the commits since that release and abcdef01 is the commit. The suffix
# sorts after its release and before the next one. A development build
# never moves :latest, so a cluster that pulls releases keeps pulling
# releases.
#
# Each version also ships deploy/ as an OCI artifact,
# ghcr.io/chrisguidry/healthchecks-operator-deploy, with the operator's image
# set to the same version. A cluster that follows the artifact with a
# Flux OCIRepository moves the manifests and the image in one revision,
# so it never applies one release's manifests with another's image. The
# tag also names the commit to pin when a cluster takes the kustomize
# base from git.
name: release

on:
  push:
    branches: [main]
    tags: ["**"]

permissions:
  contents: read
  packages: write
  # The gate step reads the state of this commit's ci run.
  actions: read

# Two tags pushed close together would otherwise race their pushes to
# :latest.
concurrency:
  group: release

env:
  IMAGE: ghcr.io/chrisguidry/healthchecks-operator
  DEPLOY: ghcr.io/chrisguidry/healthchecks-operator-deploy

jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      # git describe needs the tags, so the checkout fetches the whole
      # history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A tag of any other shape stops the run before the build, so no
      # image ships under a name that does not sort with the others.
      - name: Name the version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "$GITHUB_REF_NAME" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]{3}$' || {
              echo "the tag '$GITHUB_REF_NAME' is not a release version; a release tag looks like 2026.09.27-001"
              exit 1
            }
            echo "VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            echo "RELEASE=true" >> "$GITHUB_ENV"
          else
            # Before the first release there is no tag to describe, so
            # the base version is 0000.00.00-000.
            if described=$(git describe --tags --long --match '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]-[0-9][0-9][0-9]' 2>/dev/null); then
              release=${described%-*-g*}
              count=${described#"$release"-}
              count=${count%-g*}
            else
              release=0000.00.00-000
              count=$(git rev-list --count HEAD)
            fi
            echo "VERSION=$(printf '%s-dev-%03d-%s' "$release" "$count" "${GITHUB_SHA:0:8}")" >> "$GITHUB_ENV"
            echo "RELEASE=false" >> "$GITHUB_ENV"
          fi

      # A development build has no tag, so a kustomization that pins its
      # manifests needs the full commit sha. The run's summary prints
      # the lines to paste.
      - name: Write the pin lines
        run: |
          {
            echo '```yaml'
            echo "resources:"
            echo "  - https://github.com/$GITHUB_REPOSITORY//deploy?ref=$GITHUB_SHA"
            echo "images:"
            echo "  - name: $IMAGE"
            echo "    newTag: $VERSION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No image ships from a red gate. ci.yaml runs beside this
      # workflow on a push to main, and this step waits for it. A tag's
      # ci run finished when its commit reached main, so a tag does not
      # wait. A tag on a commit with no ci run fails: run ci on that
      # commit, then push the tag again. GITHUB_SHA names the tag object
      # for an annotated tag, so the step resolves the commit first.
      - name: Require the gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(git rev-parse "${GITHUB_SHA}^{commit}")
          for _ in $(seq 1 40); do
            state=$(gh run list --workflow ci.yaml --commit "$commit" --event push \
              --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"')
            case "$state" in
              "completed success")
                exit 0 ;;
              "completed "*)
                echo "the ci run for $commit ended with ${state#completed }; no image ships from a red gate" >&2
                exit 1 ;;
              "")
                if [ "$GITHUB_REF_TYPE" = tag ]; then
                  echo "no ci run exists for $commit; run ci on that commit, then push the tag again" >&2
                  exit 1
                fi
                echo "no ci run for $commit yet" ;;
              *)
                echo "the ci run for $commit is $state" ;;
            esac
            sleep 15
          done
          echo "the ci run for $commit did not finish within ten minutes" >&2
          exit 1

      # The build and the push are one command, so the image is pushed
      # with the provenance and SBOM that buildx attaches to a push, and
      # the gate above has already passed. SOURCE_DATE_EPOCH makes the
      # image config's creation time the commit's, not the runner's
      # clock. docker-bake.hcl holds the platforms, tags, cache, and
      # OCI keys, so the same file builds on a workstation. :latest is
      # the newest release, so a development build pushes its own tag
      # only. The :buildcache tag lets a tag's release of an
      # already-built commit rebuild nothing.
      - name: Build and push the operator
        run: |
          export SOURCE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          export REVISION
          REVISION=$(git rev-parse "${GITHUB_SHA}^{commit}")
          export CREATED SOURCE_DATE_EPOCH
          CREATED=$(git log -1 --format=%cI "$REVISION")
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct "$REVISION")
          export LATEST=$RELEASE
          docker buildx bake --push

      - uses: fluxcd/flux2/action@3fa784edd773d56630bb9f62645e08f70c2cff0a # v2.10.0
        with:
          version: 2.9.6

      # The artifact goes after the image, so it never names an image
      # that is not pushed yet. A published version never changes: a
      # rerun of a run whose artifact is already up pushes nothing.
      # :latest moves only on a release, as the image's does.
      - name: Push the deploy artifact
        run: |
          if docker buildx imagetools inspect "$DEPLOY:$VERSION" >/dev/null 2>&1; then
            echo "$DEPLOY:$VERSION is already published; a published version never changes"
          else
            dir=$(mktemp -d)
            cp -R deploy/. "$dir"
            sed -i "s/^    newTag: latest$/    newTag: $VERSION/" "$dir/kustomization.yaml"
            grep -qx "    newTag: $VERSION" "$dir/kustomization.yaml" || {
              echo "deploy/kustomization.yaml has no 'newTag: latest' line for the operator's image to set" >&2
              exit 1
            }
            commit=$(git rev-parse "${GITHUB_SHA}^{commit}")
            # The image's OCI keys come from docker-bake.hcl, so the
            # artifact carries the same url, licenses, vendor,
            # documentation, and created. flux sets source and revision
            # from its own flags, and its revision is the version with
            # the commit, which an OCIRepository reports. The title and
            # description name the artifact, not the image.
            export CREATED
            CREATED=$(git log -1 --format=%cI "$commit")
            mapfile -t annotations < <(docker buildx bake --print "healthchecks-operator" | jq -r '
              .target[].labels
              | del(.["org.opencontainers.image.source"], .["org.opencontainers.image.revision"])
              | .["org.opencontainers.image.title"] = "healthchecks-operator-deploy"
              | .["org.opencontainers.image.description"] = "Manifests that deploy healthchecks-operator, with its image set to the same version."
              | to_entries[] | "--annotations=\(.key)=\(.value)"')
            flux push artifact "oci://$DEPLOY:$VERSION" \
              --path "$dir" \
              --source "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --revision "$VERSION@sha1:$commit" \
              "${annotations[@]}"
          fi
          if [ "$RELEASE" = true ]; then
            flux tag artifact "oci://$DEPLOY:$VERSION" --tag latest
          fi
