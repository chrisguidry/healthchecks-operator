# The operator: one Deployment with two replicas. One replica leads and
# does the work, and the other waits as a standby. The leader holds a
# Lease in this namespace. When the leader stops, it releases the Lease
# and the standby takes over within a retry period of two seconds. When
# the leader's node fails, the standby takes over once the Lease has
# gone fifteen seconds without a renewal.
#
# The anti-affinity places the replicas on different nodes when the
# cluster has more than one, so one node failure cannot stop both.
#
# The pod keeps no state. It reads everything from the API server and
# from Healthchecks when it starts to lead.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: healthchecks-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthchecks-operator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthchecks-operator
  template:
    metadata:
      labels:
        app: healthchecks-operator
    spec:
      serviceAccountName: healthchecks-operator
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: healthchecks-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: ghcr.io/chrisguidry/healthchecks-operator:latest
          env:
            # The operator reads the Secrets that a ClusterProject names
            # from its own namespace.
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # To ping a heartbeat check every minute, patch in
            # HEARTBEAT_PROJECT, the name of a ClusterProject, and
            # HEARTBEAT_SLUG, the slug of a check in that project.
          ports:
            - name: metrics
              containerPort: 9200
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
